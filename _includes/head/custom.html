<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- Open links to other sites in a new tab. Links within this site, and in-page
     anchors, stay in the current tab. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      // link.protocol / link.hostname resolve relative URLs against this page,
      // so internal links always match the current hostname.
      var isWebLink = link.protocol === 'http:' || link.protocol === 'https:';
      if (isWebLink && link.hostname !== window.location.hostname && !link.target) {
        link.target = '_blank';
        link.rel = link.rel ? link.rel + ' noopener noreferrer' : 'noopener noreferrer';
      }
    }
  });
</script>
